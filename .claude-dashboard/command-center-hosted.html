/* ══════════════════════════════════════════════════════════════════
   TOKENS — light is the base; dark is redefined under BOTH the OS
   media query and the [data-theme] stamp so the toggle wins either way.
   Palette values come from the validated dataviz reference instance.
   ══════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: light;
  --plane:        #f9f9f7;
  --surface:      #fcfcfb;
  --surface-2:    #f3f3f0;
  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --ink-muted:    #898781;
  --grid:         #e1e0d9;
  --axis:         #c3c2b7;
  --hairline:     rgba(11,11,11,0.10);
  --ring:         rgba(11,11,11,0.06);

  --s1: #2a78d6;  --s2: #eb6834;  --s3: #1baf7a;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-text: #006300;

  --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-400:#3987e5; --seq-550:#1c5cab; --seq-700:#0d366b;

  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 1px 2px rgba(11,11,11,.04), 0 8px 24px -12px rgba(11,11,11,.12);
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
    --grid:#2c2c2a; --axis:#383835;
    --hairline:rgba(255,255,255,0.10); --ring:rgba(255,255,255,0.06);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good-text:#0ca30c;
    --seq-100:#0d366b; --seq-250:#184f95; --seq-400:#3987e5; --seq-550:#86b6ef; --seq-700:#cde2fb;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --axis:#383835;
  --hairline:rgba(255,255,255,0.10); --ring:rgba(255,255,255,0.06);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-text:#0ca30c;
  --seq-100:#0d366b; --seq-250:#184f95; --seq-400:#3987e5; --seq-550:#86b6ef; --seq-700:#cde2fb;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }
body {
  margin:0; background:var(--plane); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a { color:inherit; }
button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
:focus-visible { outline:2px solid var(--s1); outline-offset:2px; border-radius:4px; }

/* ── Shell ────────────────────────────────────────────────────── */
.shell { display:grid; grid-template-columns:236px 1fr; min-height:100vh; }

.sidebar {
  background:var(--surface); border-right:1px solid var(--hairline);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand { padding:18px 18px 14px; border-bottom:1px solid var(--hairline); }
.brand-name { font-weight:650; letter-spacing:-.02em; font-size:15px; }

/* ── Topbar ───────────────────────────────────────────────────── */

  th, .col-head, .nav-label { font-family: var(--sans); }
</style>

<div class="shell">

    </div>

    <input id="pinput" placeholder="Jump to a client, campaign, task, agent…" autocomplete="off" spellcheck="false">
    <div class="presults" id="presults"></div>
  </div>
</div>

<script>
"use strict";
const D = window.__DASHBOARD_DATA__ || {};
const BANNER_HTML = "\n<div class=\"note\" style=\"margin:0 0 14px;display:flex;gap:9px;align-items:flex-start\">\n  <span aria-hidden=\"true\">\u25d4</span>\n  <span><strong>Snapshot.</strong> Generated 2026-08-25 19:18 UTC from the local system \u2014\n  it does not update on its own. Re-run <code>scan.py</code> then\n  <code>build-artifact.py</code> to refresh it. Rates and task detail are\n  omitted from this hosted copy; open the local dashboard for those.</span>\n</div>\n";
const $ = (s, r=document) => r.querySelector(s);
const el = (t, a={}, ...kids) => {
  const n = document.createElement(t);
  for (const [k,v] of Object.entries(a)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false)
    n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n ?? 0).toLocaleString('en-US');
const pct = n => (n ?? 0).toFixed(2).replace(/\.?0+$/,'') + '%';

/* Client colour: stable hash into the 3 validated categorical slots.
   Identity is never colour-alone — every use pairs it with the name. */
const SLOTS = ['--s1','--s2','--s3'];
const slotFor = name => {
  let h = 0; for (const ch of String(name)) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  return `var(${SLOTS[h % SLOTS.length]})`;
};
const initials = n => String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

const toneClass = t => ({good:'good', warn:'warn', bad:'bad'}[t] || 'neutral');
const statusTone = s => {
  const t = String(s||'').toLowerCase();
  if (/active|live|running|healthy|✅|🟢/.test(t)) return 'good';
  if (/trial|pending|draft|paused|🟡|warn/.test(t)) return 'warn';
  if (/fail|blocked|degraded|🔴|critical/.test(t)) return 'bad';
  return 'neutral';
};
const cleanStatus = s => String(s||'—').replace(/[🟢🟡🔴✅⚠️❌]/g,'').trim() || '—';

/* ── Charts (inline SVG, no libraries) ─────────────────────────── */

/* Horizontal bars. One series → no legend (the title names it).
   Every bar carries a direct value label, which also satisfies the
   light-mode contrast relief rule for the aqua slot. */
function hBar(rows, {max=null, fill='var(--seq-400)', h=26, labelW=190}={}) {
  if (!rows.length) return el('div',{class:'empty'},'No data');
  const top = max ?? Math.max(...rows.map(r=>r.value), 1);
  const H = rows.length*h + 6, W = 640;
  const bx = labelW, bw = W - labelW - 62;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('class','chart');
  svg.setAttribute('role','img');
  svg.innerHTML = rows.map((r,i) => {
    const y = i*h, w = Math.max(top ? (r.value/top)*bw : 0, r.value>0 ? 3 : 0);
    return `
      <text x="0" y="${y+h/2+4}" class="axis-label" style="fill:var(--ink-2)">${esc(
        r.label.length>28 ? r.label.slice(0,27)+'…' : r.label)}</text>
      <rect x="${bx}" y="${y+5}" width="${bw}" height="${h-12}" rx="4" fill="var(--surface-2)"/>
      <rect x="${bx}" y="${y+5}" width="${w}" height="${h-12}" rx="4" fill="${r.fill||fill}"/>
      <text x="${bx+bw+8}" y="${y+h/2+4}" class="val-label">${num(r.value)}</text>
      <title>${esc(r.label)}: ${num(r.value)}</title>`;
  }).join('');
  return svg;
}

/* Vertical bars for the 7-day activity series. Single series, direct labels. */
function vBar(rows) {
  const W=640, H=150, pad=26, bw=W/rows.length;
  const top = Math.max(...rows.map(r=>r.count), 1);
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('class','chart');
  const grid = [0,.5,1].map(f => {
    const y = pad + (H-pad*2)*(1-f);
    return `<line x1="0" y1="${y}" x2="${W}" y2="${y}" class="gridline"/>`;
  }).join('');
  svg.innerHTML = grid + rows.map((r,i) => {
    const bh = top ? (r.count/top)*(H-pad*2) : 0;
    const x = i*bw + bw*0.22, w = bw*0.56, y = H-pad-bh;
    const d = new Date(r.date+'T00:00:00');
    return `
      ${r.count>0 ? `<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="4" fill="var(--seq-400)"/>
      <text x="${x+w/2}" y="${y-5}" class="val-label" text-anchor="middle">${r.count}</text>` : ''}
      <text x="${x+w/2}" y="${H-8}" class="axis-label" text-anchor="middle">${
        d.toLocaleDateString('en-US',{weekday:'short'})}</text>
      <title>${r.date}: ${r.count} log entr${r.count===1?'y':'ies'}</title>`;
  }).join('');
  return svg;
}

/* Funnel — ordinal ramp, steps stay above the 2:1 relief floor. */
function funnel(stages) {
  const live = stages.filter(s => s.value !== null && s.value !== undefined);
  if (!live.length) return el('div',{class:'empty'},'No measured stages');
  const top = Math.max(...live.map(s=>s.value),1);
  const ramp = ['var(--seq-550)','var(--seq-400)','var(--seq-250)','var(--seq-250)'];
  return el('div',{},
    ...live.map((s,i) => {
      const w = top ? Math.max((s.value/top)*100, 1.5) : 0;
      const prev = i>0 ? live[i-1].value : null;
      const conv = prev ? (100*s.value/prev) : null;
      return el('div',{style:'margin-bottom:11px'},
        el('div',{style:'display:flex;align-items:baseline;gap:8px;margin-bottom:4px'},
          el('span',{style:'font-size:12.5px;font-weight:550'}, s.label),
          el('span',{style:'margin-left:auto;font-variant-numeric:tabular-nums;font-weight:650'}, num(s.value)),
          conv !== null ? el('span',{class:'stat-meta',style:'font-size:11.5px'}, `${conv.toFixed(1)}%`) : null
        ),
        el('div',{class:'minibar',style:'height:10px'},
          el('i',{style:`width:${w}%;background:${ramp[Math.min(i,ramp.length-1)]}`}))
      );
    })
  );
}

/* Two-series trend line. ≥2 series → legend always present. */
function trend(hist) {
  if (hist.length < 2) return el('div',{class:'note'},'Building history — needs at least two daily snapshots to draw a trend.');
  const W=640,H=160,pad=30;
  const series = [
    {key:'activeTasks', label:'Active pipeline items', color:'var(--s1)'},
    {key:'activeClients', label:'Active clients', color:'var(--s2)'},
  ];
  const top = Math.max(...hist.flatMap(h=>series.map(s=>h[s.key]||0)),1);
  const x = i => pad + (i/(hist.length-1))*(W-pad*2);
  const y = v => pad + (1-(v/top))*(H-pad*2);
  const paths = series.map(s => {
    const d = hist.map((h,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(h[s.key]||0).toFixed(1)}`).join(' ');
    const dots = hist.map((h,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(h[s.key]||0).toFixed(1)}" r="3.2"
      fill="${s.color}" stroke="var(--surface)" stroke-width="2"><title>${h.date}: ${h[s.key]||0} ${esc(s.label.toLowerCase())}</title></circle>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
  }).join('');
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('class','chart');
  svg.innerHTML = [0,.5,1].map(f=>{
    const yy = pad+(H-pad*2)*(1-f);
    return `<line x1="${pad}" y1="${yy}" x2="${W-pad}" y2="${yy}" class="gridline"/>
      <text x="0" y="${yy+3}" class="axis-label">${Math.round(top*f)}</text>`;
  }).join('') + paths + `
    <text x="${pad}" y="${H-8}" class="axis-label">${hist[0].date.slice(5)}</text>
    <text x="${W-pad}" y="${H-8}" class="axis-label" text-anchor="end">${hist.at(-1).date.slice(5)}</text>`;
  return el('div',{}, svg,
    el('div',{class:'legend'}, ...series.map(s =>
      el('span',{}, el('i',{class:'swatch',style:`background:${s.color}`}), s.label))));
}

/* ── Derived data ──────────────────────────────────────────────── */
const clients   = D.clients   || [];
const campaigns = D.campaigns || [];
const ctot      = D.campaignTotals || {};
const pipeline  = D.pipeline  || {};
const agents    = D.agents    || [];
const skills    = D.skills    || [];
const history   = D.history   || [];
const allTasks  = clients.flatMap(c => (c.tasks||[]).map(t => ({...t, client:c.name})));
const openTasks = allTasks.filter(t => t.status !== 'done');
const measured  = campaigns.filter(c => c.hasMetrics);
const unmeasured= campaigns.filter(c => !c.hasMetrics);
const clientOf = f => f.clientCanonical || f.client || '—';
const flatCamps = measured.flatMap(f => f.campaigns.map(c => ({...c, file:f.fileName, client:clientOf(f), tool:f.tool||'—'})));
const activeClients = clients.filter(c => /active/i.test(c.status||''));

/* ══════════════════════════════════════════════════════════════════
   MERGING THE TWO CAMPAIGN SOURCES

   Two independent things report on campaigns and they measure different
   facts, so they are kept distinct rather than blended:

     documented — parsed from OUTPUT/Campaign Tracking/*.md. Per-campaign
                  metrics, but only for what has been written down.
     live       — pulled from the sending platforms by the backend sync.
                  Account-wide totals (and campaign names/status), but only
                  for workspaces that are actually connected.

   The danger is double counting. Today the two happen to cover disjoint
   clients, but two PlusVibe workspaces sit disconnected against clients who
   ALREADY have documented data — the moment they connect, naive addition
   would inflate every headline number. So totals are rolled up per client
   with one source elected per client, and any client carrying both is
   surfaced explicitly instead of silently summed.
   ══════════════════════════════════════════════════════════════════ */
const CD = window.__CAMPAIGNS_DATA__ || null;

const docSources = measured.map(f => ({
  kind: 'documented',
  key: f.relPath,
  label: f.title,
  client: clientOf(f),
  connected: true,
  totals: f.metrics || {},
  campaigns: (f.campaigns || []).map(c => ({...c, source:'documented', sourceLabel:f.fileName})),
  detail: f.fileName,
}));

const liveSources = Object.entries(CD?.sources || {}).map(([key, s]) => ({
  kind: 'live',
  key,
  label: s.label || key,
  client: s.client || '—',
  connected: !!s.connected,
  totals: s.totals || {},
  campaigns: (s.campaigns || []).map(c => ({
    name: c.name, status: c.status, source:'live', sourceLabel:s.label || key,
  })),
  detail: s.note || '',
  counts: s.campaignCounts || {},
}));

const allSources = [...liveSources, ...docSources];
const hasData = s => Object.keys(s.totals || {}).some(k =>
  ['sent','leads','replies','replied','opens','opened'].includes(k) && s.totals[k]);

/* Normalise the two vocabularies onto one set of keys. */
const normalise = t => ({
  sent:    t.sent ?? 0,
  leads:   t.leads ?? 0,
  replies: t.replies ?? t.replied ?? 0,
  opens:   t.opens ?? t.opened ?? 0,
  bounces: t.bounces ?? t.bounced ?? 0,
  opportunities: t.opportunities ?? 0,
});

/* One bucket per client, holding whatever reports on them. */
const coverage = {};
for (const s of allSources) {
  (coverage[s.client] ||= {client:s.client, live:[], documented:[]})[s.kind].push(s);
}
const coverageRows = Object.values(coverage).sort((a,b) => a.client.localeCompare(b.client));

/* Elect ONE source per client for the headline rollup. Live wins when it is
   connected and carrying numbers — it is the platform's own account of what
   was sent. Otherwise the documented record stands in. */
/* Rank every source that carries numbers and elect exactly ONE per client.
   Electing a set rather than a single source was the original bug: Chris Drew
   has two documented files that describe the SAME seven campaigns — one by
   leads, one by sends — so adding them inflated his lead count. The rule is
   therefore one source per client, full stop, at every level:
       3  live and connected      — the platform's own account
       2  documented with sends   — the richer written record
       1  documented, leads only  — better than nothing
   Everything not elected is shadowed: still shown, never added. */
const sourceRank = s => {
  if (!hasData(s)) return 0;
  if (s.kind === 'live') return s.connected ? 3 : 0;
  return s.totals.sent ? 2 : 1;
};
for (const row of coverageRows) {
  const ranked = [...row.live, ...row.documented]
    .filter(s => sourceRank(s) > 0)
    .sort((a,b) => sourceRank(b) - sourceRank(a));
  row.elected     = ranked.slice(0,1);
  row.shadowed    = ranked.slice(1);
  row.electedKind = row.elected[0]?.kind || null;
  row.pending     = row.live.filter(s => !s.connected);
  row.totals      = normalise(row.elected[0]?.totals || {});
}

const unified = coverageRows.reduce((acc, r) => {
  for (const [k,v] of Object.entries(r.totals)) acc[k] = (acc[k]||0) + v;
  return acc;
}, {});
unified.replyRate  = unified.sent ? +(100*unified.replies/unified.sent).toFixed(2) : 0;
unified.bounceRate = unified.sent ? +(100*unified.bounces/unified.sent).toFixed(2) : 0;

const overlaps = coverageRows.filter(r => r.shadowed.length);
const pendingSources = liveSources.filter(s => !s.connected);
const allCampaignRows = allSources.flatMap(s =>
  s.campaigns.map(c => ({...c, client:s.client, sourceKind:s.kind})));

function deltaOf(key) {
  if (history.length < 2) return null;
  const now = history.at(-1)[key], then = history[0][key];
  if (now === undefined || then === undefined) return null;
  return { diff: now - then, days: history.length };
}
function deltaEl(key) {
  const d = deltaOf(key);
  if (!d) return el('span',{class:'stat-meta'}, 'building history…');
  if (d.diff === 0) return el('span',{class:'delta flat'}, `no change · ${d.days}d`);
  const up = d.diff > 0;
  return el('span',{class:`delta ${up?'up':'down'}`}, `${up?'▲':'▼'} ${Math.abs(d.diff)}`,
    el('span',{class:'stat-meta',style:'font-weight:400'}, `over ${d.days}d`));
}

function statCard(label, value, meta) {
  return el('div',{class:'card stat'},
    el('div',{class:'stat-label'}, label),
    el('div',{class:'stat-val'}, value),
    meta ? el('div',{class:'stat-meta'}, meta) : null);
}

    el('div',{class:'grid g-kpi',style:'margin-bottom:14px'},

        el('div',{class:'stat-label'},'Emails sent'),
        el('div',{class:'stat-val'}, num(unified.sent)),
        el('div',{class:'stat-meta'}, `${allCampaignRows.length} campaigns · live + documented`)),
      el('div',{class:'card stat'},
        el('div',{class:'stat-label'},'Replies'),
        el('div',{class:'stat-val'}, num(unified.replies)),
        el('div',{class:'stat-meta'}, `${pct(unified.replyRate)} reply rate`)),

        el('div',{class:'stat-val'}, num(unified.opportunities)),

        el('div',{class:'stat-val'}, String((pipeline.Active||[]).length)),
        deltaEl('activeTasks')),
    ),

    el('div',{class:'grid g-2'},
      el('section',{class:'card'},

          el('span',{class:'card-title'},'Outbound funnel'),
          el('span',{class:'card-note'},
            `${coverageRows.filter(r=>r.electedKind).length} clients reporting`)),
        /* Only genuinely nested stages belong here: replies come out of sent,
           opportunities out of replies. "Leads contacted" is NOT a parent of
           "sent" — the two come from different files, some of which report one
           and not the other, so stacking them produced a >100% step. It is
           reported separately below instead of faking a funnel stage. */
        funnel([

        el('div',{class:'card-head'},
          el('span',{class:'card-title'},'End-of-day logging, last 7 days'),
          el('span',{class:'card-note'},'entries per day')),
        vBar(D.activity?.week || [])),

      el('section',{class:'card'},
        el('div',{class:'card-head'}, el('span',{class:'card-title'},'System trend')),
        trend(history)),

      el('section',{class:'card'},
        el('div',{class:'card-head'},
          el('span',{class:'card-title'},'Clients'),
          el('button',{class:'card-note',onclick:()=>go('clients')},'View all →')),

function viewCampaigns() {
  let mode = 'all';
  const wrap = el('div',{class:'view'});

  const sourceChip = kind => el('span',{class:`pill ${kind==='live'?'good':'neutral'}`},
    el('i',{class:'dot'}), kind === 'live' ? 'Live' : 'Documented');

  const render = () => {
    wrap.replaceChildren();

    let rows = allCampaignRows.slice();
    if (mode === 'live')       rows = rows.filter(r => r.sourceKind === 'live');
    if (mode === 'documented') rows = rows.filter(r => r.sourceKind === 'documented');
    if (mode === 'active')     rows = rows.filter(r => statusTone(r.status) === 'good');
    rows.sort((a,b) => (b.sent ?? b.leads ?? 0) - (a.sent ?? a.leads ?? 0));

    const byClient = coverageRows
      .filter(r => r.totals.sent || r.totals.leads)
      .map(r => ({label:r.client, value:r.totals.sent || r.totals.leads, fill:slotFor(r.client)}))
      .sort((a,b)=>b.value-a.value);

    wrap.append(
      el('div',{class:'page-head'},
        el('h1',{class:'page-title'},'Campaigns'),
        el('div',{class:'page-sub'},
          `${num(unified.sent)} sent · ${num(unified.replies)} replies · ` +
          `${allCampaignRows.length} campaigns from ${allSources.filter(hasData).length} reporting sources`)),

      el('div',{class:'grid g-kpi',style:'margin-bottom:14px'},
        statCard('Sent', num(unified.sent), `${coverageRows.filter(r=>r.electedKind).length} clients reporting`),
        statCard('Reply rate', pct(unified.replyRate), `${num(unified.replies)} replies`),
        statCard('Bounce rate', pct(unified.bounceRate), `${num(unified.bounces)} bounces`),
        statCard('Opportunities', num(unified.opportunities), 'documented record only')),

      /* Coverage is the honest map: who reports on whom, and how. */
      el('section',{class:'card',style:'margin-bottom:14px'},
        el('div',{class:'card-head'},
          el('span',{class:'card-title'},'Source coverage'),
          el('span',{class:'card-note'},
            `${liveSources.filter(s=>s.connected).length} of ${liveSources.length} live connections up`)),
        el('div',{class:'tw'},
          el('table',{},
            el('thead',{}, el('tr',{},
              el('th',{},'Client'), el('th',{},'Counted from'),
              el('th',{class:'num'},'Sent'), el('th',{class:'num'},'Replies'),
              el('th',{},'Also on file'), el('th',{},'Awaiting connection'))),
            el('tbody',{}, ...coverageRows.map(r => el('tr',{},
              el('td',{style:'font-weight:550'}, r.client),
              el('td',{}, r.electedKind
                ? el('span',{style:'display:inline-flex;gap:6px;align-items:center'},
                    sourceChip(r.electedKind),
                    el('span',{class:'stat-meta'}, r.elected.map(s=>s.label).join(', ').slice(0,46)))
                : el('span',{class:'stat-meta'},'nothing reporting')),
              el('td',{class:'num'}, r.totals.sent ? num(r.totals.sent) : '—'),
              el('td',{class:'num'}, r.totals.replies ? num(r.totals.replies) : '—'),
              el('td',{}, r.shadowed.length
                ? el('span',{class:'pill warn'}, el('i',{class:'dot'}),
                    `${r.shadowed.length} documented, not added`)
                : el('span',{class:'stat-meta'},'—')),
              el('td',{}, r.pending.length
                ? el('span',{class:'stat-meta'}, r.pending.map(s=>s.label.split('—')[0].trim()).join(', '))
                : el('span',{class:'stat-meta'},'—')))))))),

      overlaps.length ? el('div',{class:'note',style:'margin-bottom:14px'},
        el('strong',{},'More than one source covers the same client. '),
        overlaps.map(r => `${r.client} (counted from ${r.elected[0].label.slice(0,40)}; ${r.shadowed.length} other held back)`).join('; '),
        '. Only the elected source is added to the totals above. The others describe overlapping campaigns — Chris Drew\u2019s two files share seven campaign names between them — so summing them would inflate the figures. Every source is still listed in the table below, tagged.') : null,

      pendingSources.length ? el('div',{class:'note',style:'margin-bottom:14px'},
        el('strong',{},'Not yet connected: '),
        pendingSources.map(s=>s.label).join(' · '),
        '. Those clients are counted from their documented files until the sync is wired up — see backend/.env.example.') : null,

      el('div',{class:'grid g-2',style:'margin-bottom:14px'},
        el('section',{class:'card'},
          el('div',{class:'card-head'},
            el('span',{class:'card-title'},'Volume by client'),
            el('span',{class:'card-note'},'one source per client')),
          hBar(byClient, {labelW:150})),
        el('section',{class:'card'},
          el('div',{class:'card-head'},
            el('span',{class:'card-title'},'Largest documented campaigns'),
            el('span',{class:'card-note'},'per-campaign figures exist only on file')),
          hBar(allCampaignRows.filter(c=>c.sent>0).sort((a,b)=>b.sent-a.sent).slice(0,8)
            .map(c=>({label:c.name, value:c.sent}))))),

      el('div',{class:'tabs'},
        ...[['all',`All ${allCampaignRows.length}`],
            ['live',`Live ${allCampaignRows.filter(r=>r.sourceKind==='live').length}`],
            ['documented',`Documented ${allCampaignRows.filter(r=>r.sourceKind==='documented').length}`],
            ['active','Active']].map(([k,lab]) =>
          el('button',{class:'tab','aria-selected':String(mode===k),
            onclick:()=>{mode=k; render();}}, lab))),

      el('section',{class:'card'},
        el('div',{class:'tw'},
          el('table',{},
            el('thead',{}, el('tr',{},
              el('th',{},'Campaign'), el('th',{},'Client'), el('th',{},'Source'),
              el('th',{class:'num'},'Sent'), el('th',{class:'num'},'Leads'),
              el('th',{class:'num'},'Replies'), el('th',{},'Reply rate'), el('th',{},'Status'))),
            el('tbody',{}, ...(rows.length ? rows.map(r => {
              const rate = r.sent ? (100*(r.replies||0)/r.sent) : null;
              return el('tr',{},
                el('td',{style:'font-weight:550'}, r.name),
                el('td',{}, r.client),
                el('td',{}, sourceChip(r.sourceKind)),
                el('td',{class:'num'}, r.sent!=null?num(r.sent):'—'),
                el('td',{class:'num'}, r.leads!=null?num(r.leads):'—'),
                el('td',{class:'num'}, r.replies!=null?num(r.replies):'—'),
                el('td',{class:'bar-cell'}, rate===null ? '—' :
                  el('div',{},
                    el('div',{style:'font-variant-numeric:tabular-nums;font-size:12px;margin-bottom:3px'}, rate.toFixed(2)+'%'),
                    el('div',{class:'minibar'}, el('i',{style:`width:${Math.min(rate*12,100)}%;background:var(--seq-400)`})))),
                el('td',{}, el('span',{class:`pill ${toneClass(statusTone(r.status))}`},
                  el('i',{class:'dot'}), cleanStatus(r.status))));
            }) : [el('tr',{}, el('td',{colspan:'8'}, el('div',{class:'empty'},'No campaigns match this filter')))]))))),

      el('div',{class:'note',style:'margin-top:14px'},
        'Live rows carry a name and status but no per-campaign figures — the platform sync returns account-wide totals only, so their volume sits in the client rollup rather than on the row. Documented rows carry full per-campaign metrics.')
    );

    if (unmeasured.length) {
      wrap.append(el('section',{class:'card',style:'margin-top:14px'},
        el('div',{class:'card-head'},
          el('span',{class:'card-title'},'Documented, not measured'),
          el('span',{class:'card-note'}, `${unmeasured.length} files`)),
        el('div',{class:'note',style:'margin-bottom:11px'},
          'These files live in Campaign Tracking but carry no per-campaign metric table — they are sequences, drafts, call notes and reviews. They are listed rather than counted, so the numbers above stay true to what was actually measured.'),
        el('div',{class:'rows'}, ...unmeasured.map(f =>
          el('div',{class:'row'},
            el('div',{class:'row-main'},
              el('div',{class:'row-title'}, f.title),
              el('div',{class:'row-sub mono'}, f.relPath)),
            clientOf(f) !== '—' ? el('span',{class:'chip'}, clientOf(f)) : null,
            f.tool ? el('span',{class:'chip'}, f.tool) : null)))));
    }
  };
  render();
  return wrap;
}

let selectedClient = null;

  const sel = clients.find(c => c.name === selectedClient) || clients[0];
  return el('div',{class:'view'},
    el('div',{class:'page-head'},
      el('h1',{class:'page-title'},'Clients'),
      el('div',{class:'page-sub'}, `${activeClients.length} active · ${clients.length} total`)),
    el('div',{class:'split'},
      el('section',{class:'card'},
        el('div',{class:'rows'}, ...clients.map(c =>
          el('button',{class:'row', style: c===sel?'background:var(--surface-2)':'',
            onclick:()=>selectClient(c.name)},
            el('div',{class:'avatar',style:`background:${slotFor(c.name)}`}, initials(c.name)),
            el('div',{class:'row-main'},
              el('div',{class:'row-title'}, c.name),
              el('div',{class:'row-sub'}, cleanStatus(c.status))))))),

function clientDetail(c) {
  const tasks = c.tasks || [];
  const todo = tasks.filter(t=>t.status!=='done'), done = tasks.filter(t=>t.status==='done');
  const camps = measured.filter(f => clientOf(f) === c.name);
  return el('div',{style:'display:flex;flex-direction:column;gap:14px'},
    el('section',{class:'card'},
      el('div',{class:'card-head'},
        el('div',{class:'avatar',style:`background:${slotFor(c.name)};width:34px;height:34px`}, initials(c.name)),
        el('div',{},
          el('div',{style:'font-size:17px;font-weight:650;letter-spacing:-.02em'}, c.name),
          el('div',{class:'stat-meta'}, c.role || '—')),
        el('span',{class:`pill ${toneClass(statusTone(c.status))}`,style:'margin-left:auto'},
          el('i',{class:'dot'}), cleanStatus(c.status))),
      el('dl',{class:'kv'},
        el('dt',{},'Rate'),      el('dd',{}, c.financial?.rate || 'not set'),
        el('dt',{},'Pay type'),  el('dd',{}, c.financial?.payType || '—'),
        el('dt',{},'Commitment'),el('dd',{}, c.hours || '—'),
        el('dt',{},'Meeting'),   el('dd',{}, c.meeting || 'none documented'),
        el('dt',{},'Since'),     el('dd',{}, c.since?.label
          ? `${c.since.label} · ${String(c.since.source).replace(/_/g,' ')}` : 'unknown'),
        el('dt',{},'Profile'),   el('dd',{class:'mono'}, c.relPath)),
      c.financial?.lifetimeNote ? el('div',{class:'note',style:'margin-top:11px'}, c.financial.lifetimeNote) : null),

    camps.length ? el('section',{class:'card'},
      el('div',{class:'card-head'}, el('span',{class:'card-title'},'Campaign performance')),
      hBar(camps.flatMap(f=>f.campaigns).filter(x=>(x.sent??x.leads)>0)
        .sort((a,b)=>(b.sent??b.leads)-(a.sent??a.leads)).slice(0,6)
        .map(x=>({label:x.name, value:x.sent ?? x.leads})), {labelW:170})) : null,

    el('section',{class:'card'},
      el('div',{class:'card-head'},
        el('span',{class:'card-title'},'Tasks'),
        el('span',{class:'card-note'}, `${todo.length} open · ${done.length} done`)),
      tasks.length ? el('div',{class:'kanban'},
        el('div',{},
          el('div',{class:'col-head'}, `To do — ${todo.length}`),
          el('div',{}, ...todo.slice(0,40).map(t => el('div',{class:'task'},
            el('span',{class:'box'}), el('span',{class:'task-text'}, t.text))))),
        el('div',{},
          el('div',{class:'col-head'}, `Done — ${done.length}`),
          el('div',{}, ...done.slice(0,40).map(t => el('div',{class:'task done'},
            el('span',{class:'box'},'✓'), el('span',{class:'task-text'}, t.text)))))
      ) : el('div',{class:'empty'},'No task file matched for this client')));
}

  const buckets = Object.entries(pipeline).filter(([,v]) => (v||[]).length);
  return el('div',{class:'view'},
    el('div',{class:'page-head'},
      el('h1',{class:'page-title'},'Pipeline'),
      el('div',{class:'page-sub'},
        `${Object.values(pipeline).flat().length} items across ${buckets.length} buckets`)),
    el('div',{class:'grid g-2'}, ...buckets.map(([name, items]) =>
      el('section',{class:'card'},
        el('div',{class:'card-head'},
          el('span',{class:`pill ${toneClass(statusTone(name))}`}, el('i',{class:'dot'}), name),
          el('span',{class:'card-note'}, `${items.length}`)),
        el('div',{class:'rows'}, ...items.map(i =>
          el('div',{class:'row'},
            el('div',{class:'row-main'},
              el('div',{class:'row-title'}, i.name),
              el('div',{class:'row-sub mono'}, i.relPath)),
            el('span',{class:'stat-meta'}, (i.modified||'').slice(0,10)))))))));
}

function viewSystem() {
  const groups = agents.reduce((a,x)=>((a[x.category||'Other'] ||= []).push(x), a), {});
  return el('div',{class:'view'},
    el('div',{class:'page-head'},
      el('h1',{class:'page-title'},'Agents & Skills'),
      el('div',{class:'page-sub'}, `${agents.length} agents · ${skills.length} skills and commands`)),
    el('div',{class:'grid g-2'},
      ...Object.entries(groups).map(([cat, list]) =>
        el('section',{class:'card'},
          el('div',{class:'card-head'},
            el('span',{class:'card-title'}, cat),
            el('span',{class:'card-note'}, `${list.length}`)),
          el('div',{class:'rows'}, ...list.map(a =>
            el('div',{class:'row'},
              el('div',{class:'row-main'},
                el('div',{class:'row-title'}, a.name),
                el('div',{class:'row-sub'}, a.description)),
              el('span',{class:'chip'}, a.model)))))),
      el('section',{class:'card'},
        el('div',{class:'card-head'},
          el('span',{class:'card-title'},'Skills & commands'),
          el('span',{class:'card-note'}, `${skills.length}`)),
        el('div',{class:'rows'}, ...skills.map(s =>
          el('div',{class:'row'},
            el('div',{class:'row-main'},
              el('div',{class:'row-title'}, s.name),
              el('div',{class:'row-sub'}, s.description || s.relPath)),
            el('span',{class:'chip'}, s.kind)))))));
}

const RENDER = {overview:viewOverview, campaigns:viewCampaigns, clients:viewClients,
  tasks:viewTasks, pipeline:viewPipeline, system:viewSystem};

/* ── Router ────────────────────────────────────────────────────── */
let current = 'overview';
function go(id){ if (!RENDER[id]) return; current = id; location.hash = id; mount(); }
function mount(){
  const v = RENDER[current]();
  v.insertAdjacentHTML('afterbegin', BANNER_HTML);
  $('#views').replaceChildren(v);
  $('#crumb').textContent = VIEWS.find(v=>v.id===current)?.label || '';
  document.querySelectorAll('.nav-item').forEach(n =>
    n.setAttribute('aria-current', n.dataset.id===current ? 'page' : 'false'));
  window.scrollTo(0,0);
}
function buildNav(){
  const nav = $('#nav'); nav.replaceChildren();
  let group = null;
  for (const v of VIEWS) {
    if (v.group !== group) { group = v.group; nav.append(el('div',{class:'nav-label'}, group)); }
    nav.append(el('button',{class:'nav-item','data-id':v.id,onclick:()=>go(v.id)},
      el('span',{class:'ico'}, v.ico), v.label,
      v.count ? el('span',{class:'count'}, String(v.count())) : null));
  }
}

/* ── Command palette ───────────────────────────────────────────── */
const INDEX = [
  ...VIEWS.map(v => ({label:v.label, kind:'view', run:()=>go(v.id)})),
  ...clients.map(c => ({label:c.name, kind:'client', run:()=>{go('clients'); selectClient(c.name);}})),
  ...allCampaignRows.map(c => ({label:c.name, kind:`campaign · ${c.sourceKind}`, run:()=>go('campaigns')})),
  ...agents.map(a => ({label:a.name, kind:'agent', run:()=>go('system')})),
  ...skills.map(s => ({label:s.name, kind:'skill', run:()=>go('system')})),
  ...openTasks.slice(0,220).map(t => ({label:t.text, kind:`task · ${t.client.split(' ')[0]}`,
    run:()=>go('tasks')})),
];
let pIdx = 0, pRows = [];
function paletteRender(q=''){
  const needle = q.toLowerCase().trim();
  pRows = (needle ? INDEX.filter(i => i.label.toLowerCase().includes(needle)) : INDEX.slice(0,12)).slice(0,60);
  pIdx = 0;
  const box = $('#presults');
  box.replaceChildren(...(pRows.length ? pRows.map((r,i) =>
    el('button',{class:'pitem','aria-selected':String(i===pIdx),
      onclick:()=>{closePalette(); r.run();},
      onmouseenter:()=>{pIdx=i; paint();}},
      r.label.length>72 ? r.label.slice(0,71)+'…' : r.label,
      el('span',{class:'pkind'}, r.kind)))
    : [el('div',{class:'empty'},'Nothing matches')]));
}
function paint(){ [...$('#presults').children].forEach((c,i) =>
  c.setAttribute && c.setAttribute('aria-selected', String(i===pIdx))); }
function openPalette(){ $('#scrim').hidden = false; $('#pinput').value=''; paletteRender(); $('#pinput').focus(); }
function closePalette(){ $('#scrim').hidden = true; }

/* ── Freshness ─────────────────────────────────────────────────── */
function freshness(){
  const gen = D.generatedAt ? new Date(D.generatedAt) : null;
  const chip = $('#freshChip');
  if (!gen) { chip.textContent = 'no data'; return; }
  const mins = Math.floor((Date.now() - gen.getTime())/60000);
  chip.textContent = mins < 1 ? 'just scanned'
    : mins < 60 ? `scanned ${mins}m ago`
    : mins < 1440 ? `scanned ${Math.floor(mins/60)}h ago`
    : `scanned ${Math.floor(mins/1440)}d ago`;
  chip.title = `Data generated ${gen.toLocaleString()} — re-run scan.py to refresh`;
}

/* ── Theme ─────────────────────────────────────────────────────── */
const THEMES = ['system','light','dark'];
function applyTheme(t){
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('cc-theme', t);
  $('#themeBtn').textContent = t==='light' ? '☀' : t==='dark' ? '☾' : '◐';
  $('#themeBtn').title = `Theme: ${t}`;
}

/* ── Boot ──────────────────────────────────────────────────────── */
$('#brandName').textContent = D.me?.name || 'Command Center';
$('#brandSub').textContent  = D.me?.role || '';
buildNav();
applyTheme(localStorage.getItem('cc-theme') || 'system');
current = (location.hash.slice(1) in RENDER) ? location.hash.slice(1) : 'overview';
mount();
freshness();
setInterval(freshness, 30000);

$('#themeBtn').onclick = () => {
  const cur = localStorage.getItem('cc-theme') || 'system';
  applyTheme(THEMES[(THEMES.indexOf(cur)+1) % THEMES.length]);
};
$('#openPalette').onclick = openPalette;
$('#scrim').onclick = e => { if (e.target.id === 'scrim') closePalette(); };
$('#pinput').oninput = e => paletteRender(e.target.value);
window.onhashchange = () => { const h = location.hash.slice(1); if (h in RENDER && h !== current) { current=h; mount(); } };

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if ((e.metaKey||e.ctrlKey) && e.key === 'k') { e.preventDefault(); openPalette(); return; }
  if (!$('#scrim').hidden) {
    if (e.key === 'Escape') { closePalette(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); pIdx = Math.min(pIdx+1, pRows.length-1); paint();
      $('#presults').children[pIdx]?.scrollIntoView({block:'nearest'}); return; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); pIdx = Math.max(pIdx-1, 0); paint();
      $('#presults').children[pIdx]?.scrollIntoView({block:'nearest'}); return; }
    if (e.key === 'Enter' && pRows[pIdx]) { closePalette(); pRows[pIdx].run(); return; }
    return;
  }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); openPalette(); return; }
  const jump = {o:'overview', c:'campaigns', l:'clients', t:'tasks', p:'pipeline', s:'system'};
  if (jump[e.key.toLowerCase()]) go(jump[e.key.toLowerCase()]);
});
</script>
